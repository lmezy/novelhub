services:

  postgres:
    image: postgres:17
    container_name: novelhub-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=16MB
      -c max_connections=20
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  redis:
    image: redis:7-alpine
    container_name: novelhub-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: novelhub-search
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      TZ: ${TZ}
    volumes:
      - meili_data:/meili_data

  backend:
    build:
      context: ./backend
    container_name: novelhub-backend
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  crawler:
    build:
      context: .
      dockerfile: ./crawler/Dockerfile
    container_name: novelhub-crawler
    restart: always
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage

  scheduler:
    build:
      context: .
      dockerfile: ./scheduler/Dockerfile
    container_name: novelhub-scheduler
    restart: always
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    container_name: novelhub-frontend
    restart: always
    ports:
      - "5173:5173"

  nginx:
    image: nginx:latest
    container_name: novelhub-nginx
    restart: always
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  meili_data: