services:

  postgres:
    image: postgres:17
    container_name: novelhub-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: novelhub-redis
    restart: always
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: novelhub-search
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      TZ: ${TZ}
    volumes:
      - meili_data:/meili_data

  backend:
    build:
      context: ./backend
    container_name: novelhub-backend
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - meilisearch
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"

  crawler:
    build:
      context: .
      dockerfile: ./crawler/Dockerfile
    container_name: novelhub-crawler
    restart: always
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage

  scheduler:
    build:
      context: .
      dockerfile: ./scheduler/Dockerfile
    container_name: novelhub-scheduler
    restart: always
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    container_name: novelhub-frontend
    restart: always
    ports:
      - "5173:5173"

  nginx:
    image: nginx:latest
    container_name: novelhub-nginx
    restart: always
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  meili_data:
