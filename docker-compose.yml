# Default container log policy: without a cap the docker json-file driver
# grows forever and eventually fills the NAS disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:17
    container_name: novelhub-postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      # Host directory keeps PostgreSQL data outside Docker named volumes.
      # On Linux, make sure data/postgres is writable by UID 999:
      #   sudo chown -R 999:999 data/postgres
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host on purpose: only containers on the compose
    # network may reach the database. Use `docker compose exec postgres psql`
    # for local access.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=16MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  redis:
    image: redis:7-alpine
    container_name: novelhub-redis
    restart: always
    logging: *default-logging
    # Internal-only (no host port published); requirepass protects against
    # anything else on the compose/LAN network. appendonly keeps the Celery
    # queue across restarts.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: novelhub-search
    restart: always
    logging: *default-logging
    # Internal-only: the backend talks to it over the compose network.
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      TZ: ${TZ}
    volumes:
      - ./data/meili:/meili_data

  backend:
    build:
      context: ./backend
    container_name: novelhub-backend
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      MEILI_KEY: ${MEILI_MASTER_KEY}
      # Search-index and sync tuning.  Every one is optional; the deployment
      # file is the one place to adjust them (see .env.example for meaning).
      MEILI_CONTENT_INDEX_LIMIT: ${MEILI_CONTENT_INDEX_LIMIT:-20000}
      MEILI_MAX_TOTAL_HITS: ${MEILI_MAX_TOTAL_HITS:-200000}
      MEILI_BACKLOG_LIMIT: ${MEILI_BACKLOG_LIMIT:-200}
      MEILI_BACKLOG_POLL_SECONDS: ${MEILI_BACKLOG_POLL_SECONDS:-2}
      MEILI_BACKLOG_MAX_WAIT_SECONDS: ${MEILI_BACKLOG_MAX_WAIT_SECONDS:-300}
      SYNC_CHAPTER_CONCURRENCY: ${SYNC_CHAPTER_CONCURRENCY:-9}
      SYNC_IMAGE_CONCURRENCY: ${SYNC_IMAGE_CONCURRENCY:-3}
      SYNC_CHAPTER_COMMIT_BATCH: ${SYNC_CHAPTER_COMMIT_BATCH:-25}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - ./storage:/app/storage
      - ${LOCAL_IMPORT_VOLUME:-./data/imports}:/imports:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  crawler:
    build:
      context: .
      dockerfile: ./crawler/Dockerfile
    container_name: novelhub-crawler
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      MEILI_KEY: ${MEILI_MASTER_KEY}
      # Search-index and sync tuning.  Every one is optional; the deployment
      # file is the one place to adjust them (see .env.example for meaning).
      MEILI_CONTENT_INDEX_LIMIT: ${MEILI_CONTENT_INDEX_LIMIT:-20000}
      MEILI_MAX_TOTAL_HITS: ${MEILI_MAX_TOTAL_HITS:-200000}
      MEILI_BACKLOG_LIMIT: ${MEILI_BACKLOG_LIMIT:-200}
      MEILI_BACKLOG_POLL_SECONDS: ${MEILI_BACKLOG_POLL_SECONDS:-2}
      MEILI_BACKLOG_MAX_WAIT_SECONDS: ${MEILI_BACKLOG_MAX_WAIT_SECONDS:-300}
      SYNC_CHAPTER_CONCURRENCY: ${SYNC_CHAPTER_CONCURRENCY:-9}
      SYNC_IMAGE_CONCURRENCY: ${SYNC_IMAGE_CONCURRENCY:-3}
      SYNC_CHAPTER_COMMIT_BATCH: ${SYNC_CHAPTER_COMMIT_BATCH:-25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ${LOCAL_IMPORT_VOLUME:-./data/imports}:/imports:ro

  scheduler:
    build:
      context: .
      dockerfile: ./scheduler/Dockerfile
    container_name: novelhub-scheduler
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      MEILI_KEY: ${MEILI_MASTER_KEY}
      # Search-index and sync tuning.  Every one is optional; the deployment
      # file is the one place to adjust them (see .env.example for meaning).
      MEILI_CONTENT_INDEX_LIMIT: ${MEILI_CONTENT_INDEX_LIMIT:-20000}
      MEILI_MAX_TOTAL_HITS: ${MEILI_MAX_TOTAL_HITS:-200000}
      MEILI_BACKLOG_LIMIT: ${MEILI_BACKLOG_LIMIT:-200}
      MEILI_BACKLOG_POLL_SECONDS: ${MEILI_BACKLOG_POLL_SECONDS:-2}
      MEILI_BACKLOG_MAX_WAIT_SECONDS: ${MEILI_BACKLOG_MAX_WAIT_SECONDS:-300}
      SYNC_CHAPTER_CONCURRENCY: ${SYNC_CHAPTER_CONCURRENCY:-9}
      SYNC_IMAGE_CONCURRENCY: ${SYNC_IMAGE_CONCURRENCY:-3}
      SYNC_CHAPTER_COMMIT_BATCH: ${SYNC_CHAPTER_COMMIT_BATCH:-25}

  frontend:
    build:
      context: ./frontend
    container_name: novelhub-frontend
    restart: always
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  nginx:
    image: nginx:latest
    container_name: novelhub-nginx
    restart: always
    logging: *default-logging
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backup:
    image: postgres:17
    container_name: novelhub-backup
    restart: always
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TZ}
      # 1 = database dumps + hardlink snapshots of ./storage (minutes a day),
      # 0 = database dumps only.  See scripts/backup.sh for the whole contract.
      BACKUP_STORAGE: ${BACKUP_STORAGE:-1}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_DB_DAILY_KEEP: ${BACKUP_DB_DAILY_KEEP:-7}
      BACKUP_STORAGE_DAILY_KEEP: ${BACKUP_STORAGE_DAILY_KEEP:-7}
      BACKUP_STORAGE_WEEKLY_KEEP: ${BACKUP_STORAGE_WEEKLY_KEEP:-4}
    volumes:
      - ./data/backup:/backup
      - ./storage:/app/storage:ro
      - ./scripts/backup.sh:/usr/local/bin/novelhub-backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/novelhub-backup.sh"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---- Optional: monitoring stack (uncomment to enable) ----
  # prometheus:
  #   image: prom/prometheus
  #   container_name: novelhub-prometheus
