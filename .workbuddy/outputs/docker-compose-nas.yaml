# ============================================================
# NovelHub NAS 部署配置（host 网络模式）
# 基于 NAS 现有 /volume1/docker/NovelHub/novelhub/docker-compose.yaml 修改
# 改动点：
#   1. postgres/redis/meilisearch 只监听 127.0.0.1（原来 0.0.0.0 对整个局域网开放）
#   2. redis 增加密码（REDIS_PASSWORD，需在 .env 中添加）和 AOF 持久化
#   3. backend/crawler/scheduler 显式注入 REDIS_PASSWORD
#   4. frontend 改为生产构建镜像（删除 npm run dev 覆盖命令）
#   5. 所有服务增加容器日志轮转（10MB x 3，防止撑满磁盘）
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:17
    container_name: novelhub-postgres
    restart: always
    network_mode: host
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${POSTGRES_PORT:-15432} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 12G
    command: >
      postgres
      -p ${POSTGRES_PORT:-15432}
      -c listen_addresses=127.0.0.1
      -c shared_buffers=3GB
      -c effective_cache_size=9GB
      -c maintenance_work_mem=512MB
      -c work_mem=16MB
      -c wal_buffers=128MB
      -c max_connections=200
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c checkpoint_completion_target=0.9
      -c max_wal_size=4GB
      -c min_wal_size=1GB
      -c jit=off

  redis:
    image: redis:7-alpine
    container_name: novelhub-redis
    restart: always
    network_mode: host
    logging: *default-logging
    command: >
      redis-server
      --bind 127.0.0.1
      --port ${REDIS_PORT:-16379}
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "${REDIS_PORT:-16379}", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: novelhub-search
    restart: always
    network_mode: host
    logging: *default-logging
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_HTTP_ADDR: 127.0.0.1:${MEILI_PORT:-17700}
      TZ: ${TZ}
    volumes:
      - ./data/meili:/meili_data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 12G

  backend:
    image: lonezy/novelhub-backend
    container_name: novelhub-backend
    restart: always
    network_mode: host
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-15432}/${POSTGRES_DB}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${REDIS_PORT:-16379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MEILI_KEY: ${MEILI_MASTER_KEY}
      MEILI_HOST: http://127.0.0.1:${MEILI_PORT:-17700}
      MEILI_GRAM_BACKFILL_CHAPTERS: true
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-18000} --loop asyncio --workers 2"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - ./storage:/app/storage
      - ${LOCAL_IMPORT_VOLUME:-./data/imports}:/imports:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 5G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${BACKEND_PORT:-18000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  crawler:
    image: lonezy/novelhub-crawler
    container_name: novelhub-crawler
    restart: always
    network_mode: host
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-15432}/${POSTGRES_DB}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${REDIS_PORT:-16379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MEILI_KEY: ${MEILI_MASTER_KEY}
      MEILI_HOST: http://127.0.0.1:${MEILI_PORT:-17700}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ${LOCAL_IMPORT_VOLUME:-./data/imports}:/imports:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G

  scheduler:
    image: lonezy/novelhub-scheduler
    container_name: novelhub-scheduler
    restart: always
    network_mode: host
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-15432}/${POSTGRES_DB}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${REDIS_PORT:-16379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MEILI_KEY: ${MEILI_MASTER_KEY}
      MEILI_HOST: http://127.0.0.1:${MEILI_PORT:-17700}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  frontend:
    image: lonezy/novelhub-frontend
    container_name: novelhub-frontend
    restart: always
    network_mode: host
    logging: *default-logging
    # 生产镜像内 nginx 监听 FRONTEND_PORT（Dockerfile 默认 5173，
    # NAS host 网络模式下用 .env 的 15173，与网关 upstream 对应）。
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-15173}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  nginx:
    image: nginx:latest
    container_name: novelhub-nginx
    restart: always
    network_mode: host
    logging: *default-logging
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backup:
    image: postgres:17
    container_name: novelhub-backup
    restart: always
    network_mode: host
    logging: *default-logging
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${POSTGRES_PORT:-15432}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - ./data/backup:/backup
      - ./storage:/app/storage:ro
    entrypoint: >
      sh -c '
      mkdir -p /backup/daily /backup/weekly;
      while true; do
        TS=$$(date +%Y%m%d_%H%M);
        pg_dump -h 127.0.0.1 -p ${POSTGRES_PORT:-15432} -U $${PGUSER} -d $${PGDATABASE} -Fc -f /backup/daily/db_$${TS}.dump;
        tar -I zstd -cf /backup/daily/storage_$${TS}.tar.zst -C /app storage/ 2>/dev/null || true;
        find /backup/daily -mtime +7 -delete;
        if [ $$(date +%u) -eq 7 ]; then
          cp /backup/daily/db_$${TS}.dump /backup/weekly/;
          cp /backup/daily/storage_$${TS}.tar.zst /backup/weekly/ 2>/dev/null || true;
          find /backup/weekly -mtime +60 -delete;
        fi;
        sleep 86400;
      done
      '
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
