# ============================================================
# NAS 网关配置（替换 /volume1/docker/NovelHub/novelhub/nginx/default.conf）
# 端口 18088 与 upstream 地址保持 NAS 现状不变；新增：
#   1. /api 关闭缓冲（修复 AI 聊天 SSE 流式输出被 nginx 攒着不发的老问题）
#   2. map 修复 WebSocket 升级头（原来对所有请求都发 upgrade，不规范）
#   3. gzip + 安全响应头 + 100MB 上传上限
# ============================================================

upstream novelhub_backend {
    server 127.0.0.1:18000;
}

upstream novelhub_frontend {
    server 127.0.0.1:15173;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 18088;
    listen [::]:18088;
    server_name nas.19961113.xyz;

    client_max_body_size 100m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api {
        proxy_pass http://novelhub_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        # SSE 流式（AI 聊天）必须关缓冲，否则整段回答攒到最后才发出来
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://novelhub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
