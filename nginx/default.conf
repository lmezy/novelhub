upstream novelhub_backend {
    server backend:8000;
}

upstream novelhub_frontend {
    server frontend:5173;
}

# Only upgrade the connection when the client actually asks for it (the old
# hard-coded "upgrade" broke plain HTTP/1.1 semantics for normal requests).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP server (always available)
server {
    listen 80;
    server_name _;

    # Manual EPUB / Markdown uploads exceed nginx's 1MB default.
    client_max_body_size 100m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api {
        proxy_pass http://novelhub_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        # The AI chat / selected-text endpoints stream Server-Sent Events; with
        # buffering on, nginx holds every frame until the whole answer is done.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://novelhub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

